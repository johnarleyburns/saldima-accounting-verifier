scenario:
  id: accr-002-prepaid-insurance-and-rent
  name: Prepaid Insurance and Rent — Two Fiscal Years
  version: 1
  category: accruals
  description: >
    A service business operates for two full fiscal years on the accrual
    basis: cash service revenue each month, annual insurance prepaid in a
    lump sum at the start of each year and amortized monthly, and rent
    prepaid in a lump sum at the start of each quarter and amortized
    monthly. Validates that prepaid-expense assets flow correctly through
    the trial balance, balance sheet, and cash flow reconciliation, and
    exercises two separate fiscal-year-end closings (year-over-year
    retained-earnings carryforward) in a single scenario. See docs/plan.md
    Phase 2, scenario ACCR-002.

  accounting:
    framework: US_GAAP
    basis: accrual
    currency: USD
    fiscal_year_end: "12-31"

  rounding:
    currency_precision: 2
    method: HALF_UP

  start_date: 2026-01-01
  end_date: 2027-12-31

  cash_accounts: [cash]

  closing:
    retained_earnings_account: retained_earnings
    dates: ["2026-12-31", "2027-12-31"]

  accounts:
    - id: cash
      name: Cash
      type: asset
    - id: prepaid_insurance
      name: Prepaid Insurance
      type: asset
    - id: prepaid_rent
      name: Prepaid Rent
      type: asset
    - id: owner_equity
      name: Owner's Equity
      type: equity
    - id: retained_earnings
      name: Retained Earnings
      type: equity
    - id: service_revenue
      name: Service Revenue
      type: revenue
    - id: insurance_expense
      name: Insurance Expense
      type: expense
    - id: rent_expense
      name: Rent Expense
      type: expense

  opening_balances:
    - account_id: cash
      debit: "6000.00"
      credit: "0.00"
    - account_id: owner_equity
      debit: "0.00"
      credit: "6000.00"

  events:
