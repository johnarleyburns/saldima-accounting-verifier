          debit: "900.00"
        - account_id: cash
          credit: "900.00"
    - id: prepay-insurance-2026
      date: 2026-01-01
      type: manual_journal_entry
      lines:
        - account_id: prepaid_insurance
          debit: "1200.00"
        - account_id: cash
          credit: "1200.00"
    - id: revenue-2026-01
      date: 2026-01-15
