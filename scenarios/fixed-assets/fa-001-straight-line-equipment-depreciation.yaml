scenario:
  id: fa-001-straight-line-equipment-depreciation
  name: Straight-Line Equipment Depreciation — Five Years
  version: 1
  category: fixed-assets
  description: >
    A service business buys $60,000 of equipment on day one (zero salvage
    value, 60-month useful life, straight-line depreciation: $1,000/month)
    and operates for five full fiscal years with steady monthly cash
    revenue and expense. The `fixed_asset_purchase` event states the
    business fact and depreciation policy; the reference model derives the
    purchase entry and the full 60-month depreciation schedule itself (see
    docs/accounting-policy.md). Validates straight-line depreciation, the
    contra-asset accumulated-depreciation account netting correctly into
    net book value, and the statement of cash flows' new investing-
    activity classification (the equipment purchase is investing; the
    depreciation add-back is operating). See docs/plan.md Phase 3,
    scenario FA-001.

  accounting:
    framework: US_GAAP
    basis: accrual
    currency: USD
    fiscal_year_end: "12-31"

  rounding:
    currency_precision: 2
    method: HALF_UP

  start_date: 2026-01-01
  end_date: 2030-12-31

  cash_accounts: [cash]

  closing:
    retained_earnings_account: retained_earnings
    dates:
      - "2026-12-31"
      - "2027-12-31"
      - "2028-12-31"
      - "2029-12-31"
      - "2030-12-31"

  accounts:
    - id: cash
      name: Cash
      type: asset
    - id: equipment
      name: Equipment
      type: asset
      subtype: noncurrent_asset
      cash_flow_category: investing
    - id: accumulated_depreciation_equipment
      name: Accumulated Depreciation — Equipment
      type: asset
      subtype: contra_asset
    - id: owner_equity
      name: Owner's Equity
      type: equity
    - id: retained_earnings
      name: Retained Earnings
      type: equity
    - id: service_revenue
      name: Service Revenue
      type: revenue
    - id: operating_expense
      name: Operating Expense
      type: expense
    - id: depreciation_expense
      name: Depreciation Expense
      type: expense

  opening_balances:
    - account_id: cash
      debit: "70000.00"
      credit: "0.00"
    - account_id: owner_equity
      debit: "0.00"
      credit: "70000.00"

  events:
    - id: equip-1-purchase
      date: 2026-01-01
      type: fixed_asset_purchase
      asset_id: equip-1
      asset_account_id: equipment
      accumulated_depreciation_account_id: accumulated_depreciation_equipment
      depreciation_expense_account_id: depreciation_expense
      cash_account_id: cash
      cost: "60000.00"
      salvage_value: "0.00"
      useful_life_months: 60
    - id: revenue-2026-01
      date: 2026-01-15
      type: manual_journal_entry
      lines:
        - account_id: cash
          debit: "3000.00"
        - account_id: service_revenue
          credit: "3000.00"
    - id: expense-2026-01
      date: 2026-01-31
      type: manual_journal_entry
      lines:
        - account_id: operating_expense
          debit: "500.00"
        - account_id: cash
          credit: "500.00"
    - id: revenue-2026-02
      date: 2026-02-15
      type: manual_journal_entry
      lines:
        - account_id: cash
          debit: "3000.00"
        - account_id: service_revenue
          credit: "3000.00"
    - id: expense-2026-02
