scenario:
  id: part-002-partnership-debt-and-outside-basis
  name: Partnership Debt and Outside Basis
  version: 1
  category: partnerships
  description: >
    Partners A and B each contribute $10,000 cash (50/50) and the
    partnership takes out the same $60,000, 6%-annual, 60-month
    equal-principal loan as `DEBT-001` (reusing its exact amortization
    schedule for a direct numeric cross-check). Net income (after
    interest) is split 50/50 at each of five closings. The GAAP books
    here are ordinary -- validated the same way as every other scenario,
    via reviewed fixtures. Each partner's *outside tax basis* (IRC
    sections 705(a)/752: contribution + their share of the partnership's
    liability under section 752 + cumulative allocated income) is a tax
    concept with no GAAP journal-entry counterpart, so it is computed
    independently by reference/tax/{liabilities,partnership_basis}.py and
    validated by a dedicated test
    (tests/integration/test_part_002_outside_basis.py), never posted to
    this ledger -- see docs/accounting-policy.md. See docs/plan.md
    Phase 5, scenario PART-002.

  accounting:
    framework: US_GAAP
    basis: accrual
    currency: USD
    fiscal_year_end: "12-31"

  rounding:
    currency_precision: 2
    method: HALF_UP

  start_date: 2026-01-01
  end_date: 2030-12-31

  cash_accounts: [cash]

  closing:
    partner_allocations:
      partner_a_capital: "0.50"
      partner_b_capital: "0.50"
    dates:
      - "2026-12-31"
      - "2027-12-31"
      - "2028-12-31"
      - "2029-12-31"
      - "2030-12-31"

  accounts:
    - id: cash
      name: Cash
      type: asset
    - id: loan_payable
      name: Loan Payable
      type: liability
      subtype: noncurrent_liability
      cash_flow_category: financing
    - id: partner_a_capital
      name: Partner A Capital
      type: equity
      subtype: partner_capital
    - id: partner_b_capital
      name: Partner B Capital
      type: equity
      subtype: partner_capital
    - id: service_revenue
      name: Service Revenue
      type: revenue
    - id: operating_expense
      name: Operating Expense
      type: expense
    - id: interest_expense
      name: Interest Expense
      type: expense

  opening_balances:
    - account_id: cash
      debit: "20000.00"
      credit: "0.00"
    - account_id: partner_a_capital
      debit: "0.00"
      credit: "10000.00"
    - account_id: partner_b_capital
      debit: "0.00"
      credit: "10000.00"

  events:
    - id: loan-1-origination
      date: 2026-01-01
      type: loan_origination
      cash_account_id: cash
      loan_payable_account_id: loan_payable
      interest_expense_account_id: interest_expense
      principal: "60000.00"
      annual_interest_rate: "0.06"
      term_months: 60
    - id: revenue-2026-01
      date: 2026-01-15
      type: manual_journal_entry
      lines:
        - account_id: cash
          debit: "3000.00"
        - account_id: service_revenue
          credit: "3000.00"
    - id: expense-2026-01
      date: 2026-01-31
      type: manual_journal_entry
      lines:
        - account_id: operating_expense
          debit: "1000.00"
        - account_id: cash
          credit: "1000.00"
