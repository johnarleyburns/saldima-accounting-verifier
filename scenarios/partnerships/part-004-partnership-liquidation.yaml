scenario:
  id: part-004-partnership-liquidation
  name: Partnership Liquidation — Final Capital and Distributions
  version: 1
  category: partnerships
  description: >
    The same two-partner, 50/50 formation as `PART-001` ($30,000 cash
    each, $2,000/month net income), run for ten full fiscal years with
    no mid-life withdrawals, then wound up: on the date of the tenth and
    final closing, each partner receives a liquidating cash distribution
    exactly equal to their own final capital balance, bringing both
    partner capital accounts and the cash account to exactly $0.00. The
    liquidating distribution amount is a stated business fact the
    scenario author already knows from their own hand computation (not
    something the reference model derives from a schedule), so it stays
    on `manual_journal_entry`, like `PART-001`'s contributions and
    withdrawals. Validates that a partnership can be fully wound down to
    a clean $0.00/$0.00 ending state across a decade of multi-year
    closings. This scenario covers *book* capital-account liquidation
    only -- it does not restate each partner's outside tax basis (that is
    `PART-002`'s dedicated focus) -- see docs/accounting-policy.md. See
    docs/plan.md Phase 5, scenario PART-004.

  accounting:
    framework: US_GAAP
    basis: accrual
    currency: USD
    fiscal_year_end: "12-31"

  rounding:
    currency_precision: 2
    method: HALF_UP

  start_date: 2026-01-01
  end_date: 2035-12-31

  cash_accounts: [cash]

  closing:
    partner_allocations:
      partner_a_capital: "0.50"
      partner_b_capital: "0.50"
    dates:
      - "2026-12-31"
      - "2027-12-31"
      - "2028-12-31"
      - "2029-12-31"
      - "2030-12-31"
      - "2031-12-31"
      - "2032-12-31"
      - "2033-12-31"
      - "2034-12-31"
      - "2035-12-31"

  accounts:
    - id: cash
      name: Cash
      type: asset
    - id: partner_a_capital
      name: Partner A Capital
      type: equity
      subtype: partner_capital
    - id: partner_b_capital
      name: Partner B Capital
      type: equity
      subtype: partner_capital
    - id: service_revenue
      name: Service Revenue
      type: revenue
    - id: operating_expense
      name: Operating Expense
      type: expense

  opening_balances:
    - account_id: cash
      debit: "60000.00"
      credit: "0.00"
    - account_id: partner_a_capital
      debit: "0.00"
      credit: "30000.00"
    - account_id: partner_b_capital
      debit: "0.00"
      credit: "30000.00"

  events:
    - id: revenue-2026-01
      date: 2026-01-15
      type: manual_journal_entry
      lines:
        - account_id: cash
          debit: "3000.00"
        - account_id: service_revenue
          credit: "3000.00"
    - id: expense-2026-01
      date: 2026-01-31
      type: manual_journal_entry
      lines:
        - account_id: operating_expense
          debit: "1000.00"
        - account_id: cash
          credit: "1000.00"
