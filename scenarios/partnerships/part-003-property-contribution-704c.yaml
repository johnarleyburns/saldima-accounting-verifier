scenario:
  id: part-003-property-contribution-704c
  name: Property Contribution and Section 704(c)
  version: 1
  category: partnerships
  description: >
    Partner C contributes $60,000 cash; Partner D contributes equipment
    with a $60,000 fair market value (its GAAP book basis) but only a
    $30,000 tax basis -- a $30,000 built-in gain. The `fixed_asset_purchase`
    event's `contributed_capital_account_id` field (an alternative to
    `cash_account_id`) credits Partner D's capital account at fair market
    value instead of debiting cash, while deriving the same straight-line
    depreciation schedule as any other `fixed_asset_purchase`
    (reference/schedules/depreciation.py; 60 months, $1,000.00/month book
    depreciation). GAAP books split that book depreciation 50/50 like any
    other expense via the ordinary net-income closing allocation. Section
    704(c)'s book/tax divergence -- traditional-method tax depreciation,
    with the "ceiling rule" limiting Partner C's (the non-contributing
    partner's) tax depreciation to the partnership's $500.00/month total
    tax depreciation (on the $30,000 tax basis), leaving Partner D (the
    contributing partner) with $0.00/month tax depreciation for the
    asset's life -- has no GAAP journal-entry counterpart and is computed
    independently by reference/tax/section_704c.py, validated by a
    dedicated test (tests/integration/test_part_003_section_704c.py),
    never posted to this ledger. See docs/accounting-policy.md. See
    docs/plan.md Phase 5, scenario PART-003.

  accounting:
    framework: US_GAAP
    basis: accrual
    currency: USD
    fiscal_year_end: "12-31"

  rounding:
    currency_precision: 2
    method: HALF_UP

  start_date: 2026-01-01
  end_date: 2030-12-31

  cash_accounts: [cash]

  closing:
    partner_allocations:
      partner_c_capital: "0.50"
      partner_d_capital: "0.50"
    dates:
      - "2026-12-31"
      - "2027-12-31"
      - "2028-12-31"
      - "2029-12-31"
      - "2030-12-31"

  accounts:
    - id: cash
      name: Cash
      type: asset
    - id: equipment
      name: Equipment
      type: asset
      subtype: noncurrent_asset
      cash_flow_category: investing
    - id: accumulated_depreciation_equipment
      name: Accumulated Depreciation — Equipment
      type: asset
      subtype: contra_asset
    - id: partner_c_capital
      name: Partner C Capital
      type: equity
      subtype: partner_capital
    - id: partner_d_capital
      name: Partner D Capital
      type: equity
      subtype: partner_capital
    - id: service_revenue
      name: Service Revenue
      type: revenue
    - id: operating_expense
      name: Operating Expense
      type: expense
    - id: depreciation_expense
      name: Depreciation Expense
      type: expense

  opening_balances:
    - account_id: cash
      debit: "60000.00"
      credit: "0.00"
    - account_id: partner_c_capital
      debit: "0.00"
      credit: "60000.00"

  events:
    - id: equip-d-contribution
      date: 2026-01-01
      type: fixed_asset_purchase
      asset_id: equip-d
      asset_account_id: equipment
      accumulated_depreciation_account_id: accumulated_depreciation_equipment
      depreciation_expense_account_id: depreciation_expense
      contributed_capital_account_id: partner_d_capital
      cost: "60000.00"
      salvage_value: "0.00"
      useful_life_months: 60
    - id: revenue-2026-01
      date: 2026-01-15
      type: manual_journal_entry
      lines:
        - account_id: cash
          debit: "3000.00"
        - account_id: service_revenue
          credit: "3000.00"
    - id: expense-2026-01
      date: 2026-01-31
      type: manual_journal_entry
      lines:
        - account_id: operating_expense
          debit: "1000.00"
        - account_id: cash
          credit: "1000.00"
